services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

secrets:
  app_env:
    file: .env
